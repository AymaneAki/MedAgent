services:

  # ── Container 1: BitNet LLM Server ─────────────────────────────────────────
  bitnet-server:
    image: mcr.microsoft.com/appsvc/docs/sidecars/sample-experiment:bitnet-b1.58-2b-4t-gguf
    container_name: bitnet-server
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 4G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/health" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── Container 2: Streamlit Web UI ──────────────────────────────────────────
  medagents-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medagents-ui
    ports:
      - "8501:8501"
    depends_on:
      bitnet-server:
        condition: service_healthy
    env_file: .env
    environment:
      - BITNET_BASE_URL=http://bitnet-server:11434
      - BITNET_MODEL=bitnet-b1.58-2b-4t
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config:/app/config
    command: >
      streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    restart: unless-stopped

  # ── Container 3: CLI (on-demand, not started by default) ───────────────────
  # Run:  docker compose run --rm medagents-cli --file data/reports/report_01.txt
  # Run:  docker compose run --rm medagents-cli --dir  data/reports/
  medagents-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medagents-cli
    depends_on:
      bitnet-server:
        condition: service_healthy
    env_file: .env
    environment:
      - BITNET_BASE_URL=http://bitnet-server:11434
      - BITNET_MODEL=bitnet-b1.58-2b-4t
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config:/app/config
    entrypoint: [ "python", "main.py" ]
    profiles: [ cli ]
